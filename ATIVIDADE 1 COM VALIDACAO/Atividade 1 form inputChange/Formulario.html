<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="formulario.css">
    <script src="script.js" defer></script>

</head>

<body>

    <main class="container">
        <h1>Cadastre-se</h1>

        <form id="formulario">

            <div class="campos">
                <label for="nome">Nome Completo</label>
                <input placeholder="Digite seu nome" type="text" id="nome">
                <span class="error-message"></span>
            </div>

            <div class="campos">
                <label for="email">Email</label>
                <input placeholder="nome@exemplo.com" type="email" id="email" name="user-email">
                <span class="error-message"></span>
            </div>

            <div class="campos">
                <label for="senha">Senha</label>
                <input placeholder="Mínimo 8 caracteres, 1 maiúscula" type="password" name="senha" id="senha"
                    minlength="8">
                <span class="error-message"></span>
            </div>

            <div class="campos">
                <label for="c_senha">Confirmar senha</label>
                <input type="password" name="c_senha" id="c_senha" minlength="8">
                <span class="error-message"></span>
            </div>

            <div class="botao-style">
            <button id="botao" disabled>Cadastrar</button>
            </div>
        </form>

    </main>


</body>

</html>
