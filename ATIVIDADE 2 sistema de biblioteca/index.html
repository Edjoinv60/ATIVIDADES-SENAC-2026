<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="container">
        <h1>Biblioteca</h1>

        <form id="formulary">

            <div class="fields">
                <label for="name">Nome do Livro:</label>
                <input placeholder="Digite o nome do livro." type="text" name="user-nome" id="name" >
            </div>

            <div class="fields">
                <label for="author">Autor:</label>
                <input placeholder="Digite o nome do autor." type="text" name="user-autor" id="author">
            </div>

            <div class="fields">
                <label for="gender">Genero:</label>
                <input placeholder="Digite o genero do livro." type="text" name="genero" id="gender">
            </div>

            <div class="fields">
                <label for="quantity">Quantidade de Exemplares:</label>
                <input placeholder="Digite a quantidade de exemplares." type="text" name="quantidade de exemplares" id="quantity">
            </div>
            
            <div class="botao-style">
            <button id="botao" disabled>Cadastrar Livro</button>
            </div>
        </form>
    
</body>
</html>
